<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0a192f"/>
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#38bdf8" stroke-width="0.5" stroke-opacity="0.08"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulseHeartbeat {
      0% { stroke-dashoffset: 2000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes beaconGlow {
      0%, 100% { transform: scale(1); opacity: 0.7; }
      50% { transform: scale(1.15); opacity: 1; }
    }
    @keyframes orbitRotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes floatCross {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(2deg); }
    }
    @keyframes signalWave {
      0% { transform: scale(0.8); opacity: 0.9; }
      100% { transform: scale(2.2); opacity: 0; }
    }
    .ecg-line {
      stroke-dasharray: 2000;
      animation: pulseHeartbeat 6s linear infinite;
    }
    .beacon {
      transform-origin: 980px 180px;
      animation: beaconGlow 3s ease-in-out infinite;
    }
    .orbiting {
      transform-origin: 980px 180px;
      animation: orbitRotate 16s linear infinite;
    }
    .floating-logo {
      transform-origin: 980px 180px;
      animation: floatCross 4s ease-in-out infinite;
    }
    .wave-1 {
      transform-origin: 980px 180px;
      animation: signalWave 3s cubic-bezier(0, 0.2, 0.8, 1) infinite;
    }
    .wave-2 {
      transform-origin: 980px 180px;
      animation: signalWave 3s cubic-bezier(0, 0.2, 0.8, 1) infinite 1.5s;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="16" fill="url(#grid)"/>

  <!-- Decorative Background Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#06b6d4" opacity="0.07" filter="url(#glow)"/>
  <circle cx="980" cy="180" r="180" fill="#3b82f6" opacity="0.10" filter="url(#glow)"/>
  <circle cx="600" cy="50" r="120" fill="#8b5cf6" opacity="0.05" filter="url(#glow)"/>

  <!-- Dynamic ECG Heartbeat Line -->
  <path class="ecg-line" d="M 0,270 L 180,270 L 210,240 L 230,300 L 260,200 L 285,320 L 310,270 L 480,270 L 510,245 L 530,295 L 560,210 L 585,330 L 610,270 L 800,270 L 830,245 L 850,295 L 880,195 L 905,335 L 930,270 L 1200,270"
        fill="none" stroke="url(#primaryGrad)" stroke-width="3.5" filter="url(#glow)"/>

  <!-- Left Content: Typography & Badges -->
  <g transform="translate(70, 75)">
    <!-- Top Pill Badge -->
    <rect x="0" y="0" width="280" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2"/>
    <circle cx="16" cy="16" r="6" fill="#10b981" filter="url(#softGlow)"/>
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8" letter-spacing="1">CURATED TELEHEALTH STACK</text>

    <!-- Main Title -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Awesome <tspan fill="url(#primaryGrad)">Telemedicine</tspan>
    </text>

    <!-- Subtitle -->
    <text x="0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400" fill="#94a3b8" letter-spacing="0.2">
      Top SaaS Platforms, Open-Source Video Systems &amp; Digital Health Infrastructure
    </text>

    <!-- Feature Tags -->
    <g transform="translate(0, 155)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="28" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-opacity="0.3" stroke-width="1"/>
      <text x="12" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🩺 Virtual Visits</text>

      <!-- Tag 2 -->
      <rect x="145" y="0" width="155" height="28" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="157" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🔒 HIPAA / WebRTC</text>

      <!-- Tag 3 -->
      <rect x="310" y="0" width="155" height="28" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="1"/>
      <text x="322" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">🏥 Open-Source EHR</text>

      <!-- Tag 4 -->
      <rect x="475" y="0" width="130" height="28" rx="8" fill="#0f172a" stroke="#10b981" stroke-opacity="0.3" stroke-width="1"/>
      <text x="487" y="18" font-family="sans-serif" font-size="12" font-weight="600" fill="#e2e8f0">📊 SaaS Pricing</text>
    </g>
  </g>

  <!-- Right Visual: Animated Telemedicine Cross & Signal Rings -->
  <circle class="wave-1" cx="980" cy="180" r="50" fill="none" stroke="#06b6d4" stroke-width="2"/>
  <circle class="wave-2" cx="980" cy="180" r="50" fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- Orbiting Node Ring -->
  <g class="orbiting">
    <circle cx="980" cy="180" r="100" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-dasharray="6,8" stroke-opacity="0.4"/>
    <circle cx="1080" cy="180" r="7" fill="#06b6d4" filter="url(#softGlow)"/>
    <circle cx="880" cy="180" r="6" fill="#10b981" filter="url(#softGlow)"/>
    <circle cx="980" cy="80" r="8" fill="#8b5cf6" filter="url(#softGlow)"/>
    <circle cx="980" cy="280" r="5" fill="#3b82f6" filter="url(#softGlow)"/>
  </g>

  <!-- Central Glowing Medical Shield / Cross -->
  <g class="floating-logo">
    <circle class="beacon" cx="980" cy="180" r="68" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="3" filter="url(#glow)"/>
    <!-- Medical Cross -->
    <path d="M 965 145 H 995 V 165 H 1015 V 195 H 995 V 215 H 965 V 195 H 945 V 165 H 965 Z" 
          fill="url(#accentGrad)" filter="url(#softGlow)"/>
    <!-- Center Dot -->
    <circle cx="980" cy="180" r="5" fill="#ffffff"/>
  </g>
</svg>
